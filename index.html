<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Portal</title>
  <style>
    :root {
      --text: #f8fafc;
      --muted: #cbd5e1;
      --panel: #132548;
      --panel-2: #1a3260;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #f59e0b;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 15%, #1e3a8a 0%, transparent 28%),
        radial-gradient(circle at 90% 10%, #0891b2 0%, transparent 24%),
        linear-gradient(145deg, #020617 0%, #0f172a 52%, #111827 100%);
    }

    body.maximized {
      overflow: hidden;
    }

    .page {
      width: min(1240px, 95vw);
      margin: 20px auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      min-height: calc(100vh - 40px);
    }

    body.maximized .page {
      width: 100vw;
      max-width: none;
      margin: 0;
      min-height: 100vh;
      display: block;
    }

    .main-panel {
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    body.maximized .main-panel {
      height: 100vh;
      border-radius: 0;
      border: 0;
      padding: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    body.maximized .sub {
      display: none;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 1.9rem);
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .searchbar {
      width: min(420px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .viewer {
      background: transparent;
      border-radius: 12px;
      overflow: hidden;
      min-height: 70vh;
      border: 0;
      position: relative;
    }

    body.maximized .viewer {
      flex: 1;
      min-height: 0;
      height: 100%;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #000;
    }

    .home-grid {
      position: absolute;
      inset: 0;
      padding: 16px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
      justify-content: center;
      gap: 12px;
      align-content: start;
      background: transparent;
    }

    .home-grid.hidden { display: none; }

    .home-card {
      background: transparent;
      border: 0;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      aspect-ratio: 1;
    }

    .home-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .home-card h2 {
      margin: 0;
      font-size: 0.86rem;
      text-align: center;
    }

    .home-card p {
      display: none;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 0.82rem;
      color: #111827;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .top-btn {
      align-self: center;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    .top-btn.is-active {
      background: linear-gradient(90deg, #93c5fd, #fde68a);
    }

    .side {
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
      overflow: auto;
    }

    body.maximized .side {
      display: none;
    }

    .side h2 {
      margin: 0;
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    #gameItems {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
    }

    .game-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.18);
      padding: 6px;
      aspect-ratio: 1;
      cursor: pointer;
      text-align: center;
      color: inherit;
    }

    .game-item.active {
      border-color: rgba(34, 211, 238, 0.9);
      background: rgba(34, 211, 238, 0.12);
    }

    .game-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .game-item-title {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .game-item-desc {
      display: none;
    }

    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .viewer { min-height: 60vh; }
      .side { max-height: 42vh; }
      .topbar { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="main-panel">
      <div class="topbar">
        <div>
          <h1 id="currentTitle">Game Portal</h1>
          <p class="sub" id="currentDesc">Choose a game below or from the sidebar to play in this page.</p>
          <input id="gameSearch" class="searchbar" type="search" placeholder="Search games..." />
        </div>
        <div class="top-actions">
          <a class="btn top-btn hidden" id="onlineBtn" href="#" target="_blank" rel="noopener noreferrer">Play Online</a>
          <button class="btn top-btn" id="viewBtn" type="button">Maximize View</button>
        </div>
      </div>

      <div class="viewer">
        <iframe id="gameFrame" title="Game Player" allow="fullscreen; autoplay"></iframe>

        <div class="home-grid" id="homeGrid"></div>
      </div>
    </section>

    <aside class="side" id="gameList">
      <h2>Games</h2>
      <div id="gameItems"></div>
    </aside>
  </div>

  <script>
    (function () {
      var baseGames = [
        {
          id: "gdlite",
          title: "Geometry Dash Lite",
          file: "./geometry-dash-lite.html",
          cover: "https://play-lh.googleusercontent.com/p7kWbWBFxQIrzolEqiV5uSvctLeyssZvBV7UBOX29wzZI52IdcSs4qCB_zsQJL1mt9A",
          desc: "Jump, dodge, and keep rhythm in this fast-paced platform challenge."
        },
        {
          id: "rocket",
          title: "Rocket Goal",
          file: "./rocket-goal.html",
          cover: "https://play-lh.googleusercontent.com/xYmXleDWgPjObguVDhC-hpcC8a5yP7399awTpyPdsxIzgV52VQEAndSZ9M4WhOXQQcBs248yuB_IMUKrWz061w=w600-h300-pc0xffffff-pd",
          desc: "Control your rocket and score goals with precision and speed.",
          onlineUrl: "https://rocketgoal.app/"
        },
        {
          id: "granny",
          title: "Granny",
          file: "./granny.html",
          cover: "https://placehold.co/600x600/1f2937/e5e7eb?text=Granny",
          desc: "Survive and escape while avoiding danger in a tense horror challenge."
        },
        {
          id: "minecraft",
          title: "Minecraft",
          file: "./minecraft.html",
          cover: "https://placehold.co/600x600/14532d/e5e7eb?text=Minecraft",
          desc: "Build, explore, and craft in an open sandbox adventure."
        }
      ];

      var gameItems = document.getElementById("gameItems");
      var frame = document.getElementById("gameFrame");
      var homeGrid = document.getElementById("homeGrid");
      var currentTitle = document.getElementById("currentTitle");
      var currentDesc = document.getElementById("currentDesc");
      var viewBtn = document.getElementById("viewBtn");
      var onlineBtn = document.getElementById("onlineBtn");
      var gameSearch = document.getElementById("gameSearch");
      var currentGameFile = "";
      var currentGameId = "";
      var games = baseGames.slice();
      var filteredGames = games.slice();

      function placeholderCover(title) {
        return "https://placehold.co/600x600/1f2937/e5e7eb?text=" + encodeURIComponent(title || "Game");
      }

      function createCoverImg(game) {
        var img = document.createElement("img");
        img.src = game.cover || placeholderCover(game.title);
        img.alt = game.title + " cover";
        img.addEventListener("error", function onErr() {
          img.removeEventListener("error", onErr);
          img.src = placeholderCover(game.title);
        });
        return img;
      }

      function setActive(id) {
        var items = document.querySelectorAll(".game-item");
        items.forEach(function (el) {
          el.classList.toggle("active", el.dataset.id === id);
        });
      }

      function openGame(id) {
        var game = games.find(function (g) { return g.id === id; });
        if (!game) return;

        frame.src = game.file;
        currentGameFile = game.file;
        currentGameId = game.id;
        frame.style.display = "block";
        homeGrid.classList.add("hidden");
        currentTitle.textContent = game.title;
        currentDesc.textContent = game.desc;
        if (game.onlineUrl) {
          onlineBtn.href = game.onlineUrl;
          onlineBtn.classList.remove("hidden");
        } else {
          onlineBtn.classList.add("hidden");
        }
        setActive(id);
      }

      function activateBestView() {
        if (!currentGameFile) return;

        var popup = window.open("about:blank", "_blank");
        if (!popup) return;

        var doc = popup.document;
        var safeSrc = String(currentGameFile).replace(/"/g, "&quot;");
        doc.open();
        doc.write(
          '<!doctype html><html><head><meta charset="utf-8">' +
          '<meta name="viewport" content="width=device-width, initial-scale=1">' +
          '<title>Game View</title>' +
          '<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style>' +
          '</head><body><iframe src="' + safeSrc + '" allow="fullscreen; autoplay"></iframe></body></html>'
        );
        doc.close();
      }

      function renderSidebar(items) {
        gameItems.innerHTML = "";
        items.forEach(function (game) {
          var item = document.createElement("button");
          item.className = "game-item";
          item.type = "button";
          item.dataset.id = game.id;

          item.appendChild(createCoverImg(game));
          var wrap = document.createElement("div");
          var title = document.createElement("p");
          title.className = "game-item-title";
          title.textContent = game.title;
          var desc = document.createElement("p");
          desc.className = "game-item-desc";
          desc.textContent = game.desc;
          wrap.appendChild(title);
          wrap.appendChild(desc);
          item.appendChild(wrap);

          item.addEventListener("click", function () {
            openGame(game.id);
          });
          gameItems.appendChild(item);
        });
        setActive(currentGameId);
      }

      function renderHomeCards(items) {
        homeGrid.innerHTML = "";
        items.forEach(function (game) {
          var card = document.createElement("article");
          card.className = "home-card";
          card.appendChild(createCoverImg(game));

          var title = document.createElement("h2");
          title.textContent = game.title;
          card.appendChild(title);

          var desc = document.createElement("p");
          desc.textContent = game.desc;
          card.appendChild(desc);

          var playBtn = document.createElement("button");
          playBtn.className = "btn";
          playBtn.type = "button";
          playBtn.textContent = "Play";
          playBtn.addEventListener("click", function () {
            openGame(game.id);
          });

          card.appendChild(playBtn);
          homeGrid.appendChild(card);
        });
      }

      function applySearchFilter() {
        var q = gameSearch.value.trim().toLowerCase();
        if (!q) {
          filteredGames = games.slice();
        } else {
          filteredGames = games.filter(function (g) {
            return g.title.toLowerCase().indexOf(q) !== -1;
          });
        }
        renderSidebar(filteredGames);
        renderHomeCards(filteredGames);
      }

      function mergeExtraGames(extraGames) {
        var seen = {};
        games.forEach(function (g) { seen[g.file] = true; });
        extraGames.forEach(function (g) {
          if (!seen[g.file]) {
            games.push(g);
            seen[g.file] = true;
          }
        });
      }

      renderHomeCards(filteredGames);
      renderSidebar(filteredGames);
      viewBtn.addEventListener("click", activateBestView);
      gameSearch.addEventListener("input", applySearchFilter);

      fetch("./extra-games.json")
        .then(function (res) { return res.json(); })
        .then(function (extraGames) {
          mergeExtraGames(extraGames);
          applySearchFilter();
        })
        .catch(function () {
          // Base games still work if batch file is missing.
        });
    })();
  </script>
</body>
</html>
